name: Bindplane Collector
version: "1.109.0.1"
slug: bindplane_collector
description: Bindplane Distro for OpenTelemetry Collector, managed by Bindplane
url: https://github.com/observIQ/bindplane-home-assistant-add-on
image: ghcr.io/observiq/{arch}-bindplane-home-assistant-collector
stage: experimental
arch:
  - aarch64
  - amd64
init: false
startup: services
hassio_api: true
discovery:
  - bindplane
ports:
  4317/tcp: null
  4318/tcp: null
options:
  endpoint: wss://app.bindplane.com/v1/opamp
  secret_key: ""
  agent_name: Home Assistant
  labels: []
  tls_insecure: false
schema:
  endpoint: url
  secret_key: password?
  agent_name: str
  labels:
    - match(^[A-Za-z0-9_.-]+=[A-Za-z0-9_.-]*$)
  tls_insecure: bool
