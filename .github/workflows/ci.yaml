name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./bindplane_collector

  addon-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    env:
      IMAGE: ghcr.io/observiq/${{ matrix.arch }}-bindplane-home-assistant-collector
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build args
        run: echo "VERSION=$(yq '.version' bindplane_collector/config.yaml)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          docker buildx build bindplane_collector \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$VERSION" \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.version="$VERSION" \
            --label io.hass.type=app \
            --label io.hass.arch=${{ matrix.arch }} \
            --label io.hass.version="$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --load
      - name: Smoke test
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh "$IMAGE:$VERSION" -c '
            set -e
            /opt/bdot/observiq-otel-collector --version
            for c in bashio jq paste curl; do command -v "$c"; done
            test -x /run.sh'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already published; bump the version in bindplane_collector/config.yaml to publish changes."
          else
            docker push "$IMAGE:$VERSION"
          fi
