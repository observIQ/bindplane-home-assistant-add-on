name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./bindplane_collector

  addon-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          docker buildx build bindplane_collector \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM=$(yq '.build_from.${{ matrix.arch }}' bindplane_collector/build.yaml) \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION=$(yq '.version' bindplane_collector/config.yaml) \
            --tag bindplane-collector:test \
            --load
      - name: Smoke test
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh bindplane-collector:test -c '
            set -e
            /opt/bdot/observiq-otel-collector --version
            journalctl --version
            for c in bashio jq paste curl; do command -v "$c"; done
            test -x /run.sh'
